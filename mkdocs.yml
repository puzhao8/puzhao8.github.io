site_name: Puzhao Zhang
site_description: Research homepage of Puzhao Zhang, DHI - satellite mapping of wetlands and surface water.
site_url: https://puzhao8.github.io/
copyright: "&copy; 2026 Puzhao Zhang"

theme:
  name: material
  custom_dir: overrides
  font:
    text: Source Serif 4
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.arithmatex:
      generic: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/puzhao8
      name: GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:puzh@dhigroup.com
      name: Email

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Research: research.md
  - Publications: publications.md
  - Software and Data: projects.md
